<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>页签录音录像</title></head>
<body class="popup-page"><main class="popup">
  <div class="brand"><div class="brand-mark">●</div><div><strong>页签录音录像</strong><small>录制 · 简单剪辑 · 下载</small></div></div>
  <div id="tabTitle" class="tab-name">当前页签</div>
  <div id="idlePanel"><p class="muted">选择要录制的内容</p>
    <button id="recordVideo" class="button primary full">▣　开始录制视频 + 声音</button>
    <button id="recordAudio" class="button secondary full">♫　仅录制声音</button>
    <p class="tiny">仅录制当前网页页签，不录制其他应用。</p>
  </div>
  <div id="activePanel" hidden><div class="record-dot">●　<span id="statusLabel">正在录制</span></div><div class="clock" id="clock">00:00</div>
    <div class="button-row"><button id="pause" class="button secondary">暂停</button><button id="stop" class="button danger">■ 结束并编辑</button></div>
  </div>
  <p id="error" class="error" role="alert" hidden></p>
  <div class="popup-footer"><button id="openEditor" class="link-button">打开录制历史与编辑器 →</button></div>
</main><script src="popup.js"></script></body></html>
